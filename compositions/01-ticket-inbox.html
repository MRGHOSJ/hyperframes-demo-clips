        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        var TICKET_HEIGHT = 109;
        var TOTAL_TICKETS = 40;
        var TOTAL_SCROLL = TOTAL_TICKETS * TICKET_HEIGHT;
        var SCROLL_DURATION = 12;

        var container = document.getElementById("ticket-container");

        // Header reveal at t=0.8s
        tl.fromTo(".header",
          { opacity: 0, y: -20 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.8
        );

        // Ticket cards stagger in at t=1.0s
        tl.fromTo(".ticket-card",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", stagger: 0.03 },
          1.0
        );

        // Main scroll animation starting at t=1.5s
        tl.to(container, {
          y: -TOTAL_SCROLL,
          duration: SCROLL_DURATION - 1.5,
          ease: "none"
        }, 1.5);

        var counterEl = document.getElementById("ticket-count");
        var counterObj = { value: 1847 };
        tl.to(counterObj, {
          value: 1852,
          duration: 11,
          ease: "power1.inOut",
          onUpdate: function() {
            counterEl.textContent = Math.round(counterObj.value).toLocaleString();
          }
        }, 0);

        var statusDot = document.getElementById("status-dot");
        var flickerTimes = [2.0, 3.5, 5.0, 6.5, 7.8, 9.2, 10.5, 11.3];
        var flickerOpacities = [0.3, 0.5, 0.2, 0.6, 0.3, 0.4, 0.2, 0.5];

        for (var fi = 0; fi < flickerTimes.length; fi++) {
          tl.to(statusDot, {
            opacity: flickerOpacities[fi],
            duration: 0.05,
            ease: "none"
          }, flickerTimes[fi]);
          tl.to(statusDot, {
            opacity: 1,
            duration: 0.05,
            ease: "none"
          }, flickerTimes[fi] + 0.05);
        }

        var cards = document.querySelectorAll(".ticket-card");
        var viewportCenter = 540;

        for (var ci = 0; ci < cards.length; ci++) {
          var cardEnterCenter = (ci * TICKET_HEIGHT - viewportCenter + 200) / (TOTAL_SCROLL / SCROLL_DURATION);
          var cardExitCenter = (ci * TICKET_HEIGHT + TICKET_HEIGHT - viewportCenter + 200) / (TOTAL_SCROLL / SCROLL_DURATION);

          if (cardEnterCenter >= 0 && cardEnterCenter < SCROLL_DURATION) {
            tl.to(cards[ci], {
              boxShadow: "inset 0 0 40px rgba(59, 130, 246, 0.12)",
              duration: 0.3,
              ease: "power2.inOut",
              overwrite: "auto"
            }, cardEnterCenter);
          }
          if (cardExitCenter >= 0 && cardExitCenter < SCROLL_DURATION) {
            tl.to(cards[ci], {
              boxShadow: "inset 0 0 0px rgba(59, 130, 246, 0)",
              duration: 0.3,
              ease: "power2.inOut",
              overwrite: "auto"
            }, cardExitCenter);
          }
        }

        window.__timelines["ticket-inbox"] = tl;
      </script>
    </template>
  </body>
</html>
