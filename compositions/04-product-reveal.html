<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
  </head>
  <body>
    <template>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #0a0e1a;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          color: #e2e8f0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .grid-bg {
          position: absolute;
          inset: 0;
          pointer-events: none;
          opacity: 0.03;
          background-image:
            linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
          background-size: 60px 60px;
        }

        .ambient-glow {
          position: absolute;
          width: 600px;
          height: 600px;
          border-radius: 50%;
          filter: blur(160px);
          pointer-events: none;
          opacity: 0;
        }
        .glow-cyan {
          background: #4fd1c5;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }

        .fade-overlay {
          position: absolute;
          inset: 0;
          background: #0a0e1a;
          z-index: 100;
          pointer-events: none;
          opacity: 0;
        }

        /* Rows */
        .rows {
          display: flex;
          flex-direction: column;
          gap: 48px;
          z-index: 10;
        }

        .row {
          display: flex;
          align-items: center;
          gap: 32px;
        }

        .icon-box {
          width: 64px;
          height: 64px;
          border-radius: 14px;
          border: 2px solid #f97316;
          background: #1a1f2e;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          position: relative;
        }

        .icon-box svg {
          width: 30px;
          height: 30px;
          position: absolute;
        }

        .icon-box .icon-solved {
          opacity: 0;
        }

        .label {
          font-size: 36px;
          font-weight: 700;
          color: #f1f5f9;
          letter-spacing: 3px;
          text-transform: uppercase;
        }

        .label .prefix {
          display: inline-block;
        }

        .label .word {
          display: inline-block;
        }

        /* Wordmark */
        .wordmark-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 20;
          pointer-events: none;
        }

        .wordmark {
          font-size: 72px;
          font-weight: 700;
          color: #f1f5f9;
          letter-spacing: 6px;
          opacity: 0;
        }

        .tagline {
          font-size: 20px;
          font-weight: 400;
          color: #94a3b8;
          margin-top: 20px;
          opacity: 0;
        }

        .subtitle {
          font-size: 16px;
          font-weight: 500;
          color: #94a3b8;
          margin-top: 14px;
          letter-spacing: 1px;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="product-reveal" data-width="1920" data-height="1080" data-duration="8" data-start="0">
        <div class="grid-bg"></div>
        <div class="ambient-glow glow-cyan"></div>
        <div class="fade-overlay" id="fade-overlay"></div>

        <!-- Rows (start visible — end state of scene 3) -->
        <div class="rows" id="rows">
          <div class="row" id="row-1">
            <div class="icon-box" id="icon-1">
              <svg class="icon-original" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
              </svg>
              <svg class="icon-solved" viewBox="0 0 24 24" fill="none" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <span class="label" id="text-1"><span class="prefix">NO </span><span class="word">ISOLATION</span></span>
          </div>

          <div class="row" id="row-2">
            <div class="icon-box" id="icon-2">
              <svg class="icon-original" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
              <svg class="icon-solved" viewBox="0 0 24 24" fill="none" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <span class="label" id="text-2"><span class="prefix">NO </span><span class="word">AUDIT TRAIL</span></span>
          </div>

          <div class="row" id="row-3">
            <div class="icon-box" id="icon-3">
              <svg class="icon-original" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <svg class="icon-solved" viewBox="0 0 24 24" fill="none" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <span class="label" id="text-3"><span class="prefix">NO </span><span class="word">SELF-SERVICE</span></span>
          </div>
        </div>

        <!-- Wordmark + tagline (hidden initially) -->
        <div class="wordmark-wrap" id="wordmark-wrap">
          <div class="wordmark" id="wordmark">Proxmox IaaS Platform</div>
          <div class="tagline" id="tagline">Self-service cloud infrastructure provisioning</div>
          <div class="subtitle" id="subtitle">Provision. Isolate. Audit. All from one console.</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // Helper: transform one row from "NO X" → "X"
        function transformRow(iconId, textId, time) {
          // Border color shift
          tl.to(iconId, {
            borderColor: "#4fd1c5",
            duration: 0.3,
            ease: "power2.inOut"
          }, time);

          // Crossfade icons
          tl.to(iconId + " .icon-original", {
            opacity: 0,
            duration: 0.2,
            ease: "power2.inOut"
          }, time);
          tl.to(iconId + " .icon-solved", {
            opacity: 1,
            duration: 0.2,
            ease: "power2.inOut"
          }, time);

          // Fade out "NO " prefix
          tl.to(textId + " .prefix", {
            opacity: 0,
            y: -10,
            duration: 0.3,
            ease: "power2.inOut"
          }, time);
        }

        // Phase 1: Transform rows (1.0s – 1.9s)
        transformRow("#icon-1", "#text-1", 1.0);
        transformRow("#icon-2", "#text-2", 1.3);
        transformRow("#icon-3", "#text-3", 1.6);

        // Phase 2: Rows fade out (2.2s – 2.8s)
        tl.to("#rows", {
          opacity: 0,
          y: -30,
          duration: 0.6,
          ease: "power2.inOut"
        }, 2.2);

        // Phase 3: Wordmark reveal (3.2s) with overshoot
        tl.to(".glow-cyan", {
          opacity: 0.08,
          duration: 0.5,
          ease: "power2.out"
        }, 3.2);
        tl.fromTo("#wordmark",
          { opacity: 0, scale: 0.9 },
          {
            opacity: 1,
            scale: 1,
            duration: 0.8,
            ease: "power3.out",
            keyframes: [
              { scale: 1.02, ease: "power2.in" },
              { scale: 1, ease: "power2.out" }
            ]
          },
          3.2
        );

        // Phase 4: Tagline (4.5s)
        tl.fromTo("#tagline",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          4.5
        );

        // Phase 5: Subtitle (5.5s)
        tl.fromTo("#subtitle",
          { opacity: 0, y: 15 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          5.5
        );

        // Phase 6: Fade to black (7.2s – 8.0s)
        tl.to("#fade-overlay", {
          opacity: 1,
          duration: 0.8,
          ease: "power2.inOut"
        }, 7.2);

        window.__timelines["product-reveal"] = tl;
      </script>
    </template>
  </body>
</html>
