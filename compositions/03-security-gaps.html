<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
  </head>
  <body>
    <template>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #0a0e1a;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          color: #e2e8f0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        /* Subtle grid pattern */
        .grid-bg {
          position: absolute;
          inset: 0;
          pointer-events: none;
          opacity: 0.03;
          background-image:
            linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
          background-size: 60px 60px;
        }

        /* Ambient glows */
        .ambient-glow {
          position: absolute;
          width: 500px;
          height: 500px;
          border-radius: 50%;
          filter: blur(150px);
          opacity: 0.06;
          pointer-events: none;
        }
        .glow-orange {
          background: #f97316;
          top: 30%;
          left: 50%;
          transform: translateX(-50%);
        }

        /* Content container */
        .content {
          display: flex;
          flex-direction: column;
          gap: 48px;
          z-index: 10;
        }

        /* Row */
        .row {
          display: flex;
          align-items: center;
          gap: 32px;
          opacity: 0;
        }

        /* Icon container */
        .icon-box {
          width: 64px;
          height: 64px;
          border-radius: 14px;
          border: 2px solid #f97316;
          background: #1a1f2e;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          opacity: 0;
        }

        .icon-box svg {
          width: 30px;
          height: 30px;
        }

        /* Text */
        .label {
          font-size: 36px;
          font-weight: 700;
          color: #f1f5f9;
          letter-spacing: 3px;
          text-transform: uppercase;
        }
      </style>

      <div id="root" data-composition-id="security-gaps" data-width="1920" data-height="1080" data-duration="8" data-start="0">
        <div class="grid-bg"></div>
        <div class="ambient-glow glow-orange"></div>

        <div class="content">
          <!-- Row 1: NO ISOLATION -->
          <div class="row" id="row-1">
            <div class="icon-box" id="icon-1">
              <svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
              </svg>
            </div>
            <span class="label" id="text-1">NO ISOLATION</span>
          </div>

          <!-- Row 2: NO AUDIT TRAIL -->
          <div class="row" id="row-2">
            <div class="icon-box" id="icon-2">
              <svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </div>
            <span class="label" id="text-2">NO AUDIT TRAIL</span>
          </div>

          <!-- Row 3: NO SELF-SERVICE -->
          <div class="row" id="row-3">
            <div class="icon-box" id="icon-3">
              <svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <span class="label" id="text-3">NO SELF-SERVICE</span>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // Row 1 at 0.6s
        tl.fromTo("#icon-1",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" },
          0.6
        );
        tl.fromTo("#text-1",
          { x: -50, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          0.7
        );
        tl.to("#row-1", { opacity: 1, duration: 0.01 }, 0.6);

        // Row 2 at 2.2s
        tl.fromTo("#icon-2",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" },
          2.2
        );
        tl.fromTo("#text-2",
          { x: -50, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          2.3
        );
        tl.to("#row-2", { opacity: 1, duration: 0.01 }, 2.2);

        // Row 3 at 3.8s
        tl.fromTo("#icon-3",
          { scale: 0.6, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" },
          3.8
        );
        tl.fromTo("#text-3",
          { x: -50, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          3.9
        );
        tl.to("#row-3", { opacity: 1, duration: 0.01 }, 3.8);

        window.__timelines["security-gaps"] = tl;
      </script>
    </template>
  </body>
</html>
